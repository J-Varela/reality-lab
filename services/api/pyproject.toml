[project]
name = "reality-api"
version = "0.1.0"
description = "FastAPI service for Hermes Reality Lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "reality-core",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reality_api"]

[tool.uv.sources]
reality-core = { workspace = true }